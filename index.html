<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hand Field</title>
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": {
    "three": "./vendor/three/three.module.js",
    "three/addons/": "./vendor/three/addons/"
} }
</script>
</head>
<body>
  <video id="bgv" playsinline muted></video>
  <div id="stage"></div>
  <canvas id="vfx"></canvas>
  <canvas id="fx"></canvas>

  <!-- 좌상단: 타이틀 -->
  <header class="hud tl">
    <div class="title">HAND<span>·</span>FIELD</div>
    <div class="sub" id="status">booting…</div>
  </header>

  <!-- 좌측: 손으로 누를 수 있는 컨트롤 (손가락을 올려두면 채워지며 클릭, 또는 핀치로 즉시 클릭) -->
  <nav class="hud left">
    <section class="node">
      <div class="node-h">MODE</div>
      <div class="row">
        <button class="hbtn" data-mode="text"><b>01</b>TEXT</button>
        <button class="hbtn" data-mode="flow"><b>02</b>FLOW</button>
      </div>
      <div class="row">
        <button class="hbtn" data-mode="cloud"><b>03</b>CLOUD</button>
        <button class="hbtn" data-mode="box"><b>04</b>BOX</button>
      </div>
      <div class="row">
        <button class="hbtn" data-mode="orb"><b>05</b>ORB</button>
        <button class="hbtn" data-mode="hud"><b>06</b>HUD</button>
      </div>
    </section>
    <section class="node">
      <div class="node-h">COLOR</div>
      <div class="row">
        <button class="hbtn sw" data-pal="ice"><i style="--c:#9fe0ff"></i>ICE</button>
        <button class="hbtn sw" data-pal="ember"><i style="--c:#ff7a2e"></i>EMBER</button>
      </div>
      <div class="row">
        <button class="hbtn sw" data-pal="neon"><i style="--c:#c86bff"></i>NEON</button>
        <button class="hbtn sw" data-pal="mono"><i style="--c:#e8e8e8"></i>MONO</button>
      </div>
    </section>
    <section class="node" id="textNode">
      <div class="node-h">TEXT</div>
      <div class="row">
        <button class="hbtn" data-text="A">A</button>
        <button class="hbtn" data-text="HELLO">HELLO</button>
      </div>
      <div class="row">
        <button class="hbtn" data-text="손">손</button>
        <button class="hbtn" data-text="TOUCH">TOUCH</button>
      </div>
      <input id="txt" maxlength="12" placeholder="직접 입력 + Enter" spellcheck="false">
    </section>
    <section class="node" id="boxNode">
      <div class="node-h">FILTER <span>✊ 주먹 = 다음</span></div>
      <div class="row">
        <button class="hbtn" data-filter="mosaic">MOSAIC</button>
        <button class="hbtn" data-filter="dither">DITHER</button>
      </div>
      <div class="row">
        <button class="hbtn" data-filter="thermal">THERMAL</button>
        <button class="hbtn" data-filter="ascii">ASCII</button>
      </div>
    </section>
    <section class="node" id="hudNode">
      <div class="node-h">LAYERS</div>
      <div class="row">
        <button class="hbtn" data-layer="bars">BARS</button>
        <button class="hbtn" data-layer="ticks">TICKS</button>
      </div>
      <div class="row">
        <button class="hbtn" data-layer="rings">RINGS</button>
        <button class="hbtn" data-layer="labels">LABELS</button>
      </div>
      <div class="node-h sub-h">AUDIO</div>
      <div class="row">
        <button class="hbtn" data-audio="synth">SYNTH</button>
        <button class="hbtn" data-audio="mic">MIC</button>
      </div>
    </section>
    <section class="node">
      <div class="node-h">FX</div>
      <div class="row">
        <button class="hbtn" data-toggle="trails">TRAILS</button>
        <button class="hbtn" data-toggle="skel">SKELETON</button>
      </div>
    </section>
  </nav>

  <!-- 우상단: 카메라 미리보기 + 손 인식 -->
  <aside class="hud tr" id="cam">
    <div class="node-h"><span>CAM_IN</span><span id="camInfo">— hands</span></div>
    <div class="cam-view" id="camView">
      <video id="vid" playsinline muted></video>
      <canvas id="camFx"></canvas>
      <div class="cam-empty" id="camEmpty">카메라 대기 중</div>
    </div>
    <div class="cam-foot" id="camFoot">
      <div>A <span>—</span></div>
      <div>B <span>—</span></div>
    </div>
  </aside>

  <!-- 하단: 제스처 안내 (모드별로 main.js가 채움) -->
  <footer class="hud bottom" id="hints"></footer>

  <script type="module" src="main.js"></script>
</body>
</html>
